<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduZone – Componentized</title>
  <!-- CSS order -->
  <link rel="stylesheet" href="css/plugins.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/templete.css">
  <link rel="stylesheet" href="css/responsive.css">

      <div data-include="components/gallery.html"></div>
      <div data-include="components/events.html"></div>

    <div data-include="components/newsletter.html"></div>

    <button class="scroltop style1 white icon-up" type="button"><i class="fas fa-arrow-up"></i></button>

  <script src="plugins/wow/wow.js"></script>

  <script src="js/dz.carousel.js"></script>
  <script src="plugins/countdown/jquery.countdown.js"></script>
  <script src="js/dz.ajax.js"></script>
  <script src="js/rev.slider.js"></script>
